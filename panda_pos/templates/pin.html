{% extends "base.html" %}
{% block title %}Manager PIN{% endblock %}
{% block body_class %}centered{% endblock %}
{% block content %}
<form class="card dialog" method="post">
  <h2>Enter Manager PIN</h2>
  <input class="field" type="password" name="pin" inputmode="numeric" maxlength="8" autofocus required>
  <div class="actions">
    <a class="btn btn-secondary" href="{{ url_for('cashier') }}">Cancel</a>
    <button class="btn btn-primary">OK</button>
  </div>
</form>
{% endblock %}
